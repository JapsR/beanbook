<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beanbook</title>
<meta name="theme-color" content="#DE2C4A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Beanbook">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: one phone-width column; big type header, dense tappable rows,
   every brew method carries its own colour (the way nzb360 colours each service),
   bottom tabs + one floating action, forms rise as sheets. */
:root{
  --bg:#F2F5FA; --outer:#E4E9F1; --surface:#FFFFFF; --soft:#EAEFF6; --line:#DDE3EC;
  --ink:#0E1626; --muted:#5C6879;
  --accent:#DE2C4A; --accent-ink:#FFFFFF; --gold:#EFA400; --good:#16875A; --bad:#C62F2F;
  --shadow:0 1px 2px rgba(14,22,38,.05),0 6px 20px rgba(14,22,38,.06);
  --font-display:"Bricolage Grotesque","Hanken Grotesk",system-ui,sans-serif;
  --font-body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:18px; --r-s:12px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D121D; --outer:#070A11; --surface:#161C2A; --soft:#1F2737; --line:#283144;
    --ink:#EEF2F8; --muted:#98A4B8;
    --accent:#FF5C74; --accent-ink:#1A0508; --gold:#FFC23D; --good:#4CCB94; --bad:#FF7A7A;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D121D; --outer:#070A11; --surface:#161C2A; --soft:#1F2737; --line:#283144;
  --ink:#EEF2F8; --muted:#98A4B8;
  --accent:#FF5C74; --accent-ink:#1A0508; --gold:#FFC23D; --good:#4CCB94; --bad:#FF7A7A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--outer);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;
  -webkit-font-smoothing:antialiased;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;border:0;background:none;padding:0}
img{max-width:100%;display:block}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:-.02em}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}

#app{position:relative;height:100%;max-width:480px;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
@media (min-width:520px){#app{box-shadow:0 0 0 1px var(--line),0 20px 60px rgba(14,22,38,.12)}}
#view{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:0 16px 104px}
#view.enter>*{animation:rise .2s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:.4;transform:translateY(8px)}to{opacity:1;transform:none}}

/* tabs */
#tabs{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 4px;border-radius:14px;color:var(--muted);font-size:11.5px;font-weight:600;transition:color .12s,transform .1s}
.tab .pill{display:grid;place-items:center;width:56px;height:30px;border-radius:15px;transition:background .15s}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"] .pill{background:color-mix(in srgb,var(--accent) 16%,var(--surface));color:var(--accent)}
.tab:active{transform:scale(.94)}

/* fab */
#fab{position:absolute;right:16px;bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:5;display:flex;align-items:center;gap:8px;
  height:54px;padding:0 20px 0 16px;border-radius:27px;background:var(--accent);color:var(--accent-ink);font-weight:700;
  box-shadow:0 8px 22px color-mix(in srgb,var(--accent) 40%,transparent);transition:transform .1s}
#fab:active{transform:scale(.95)}
#fab[hidden]{display:none}

/* headers */
.hero{padding:22px 0 12px;display:flex;flex-direction:column;gap:10px}
.hero h1{font-size:34px;font-weight:800;line-height:1.02}
.hero h1 em{font-style:normal;color:var(--accent)}
.sub{color:var(--muted)}
.strip{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.strip div{padding:12px 14px;display:flex;flex-direction:column;gap:1px}
.strip div+div{border-left:1px solid var(--line)}
.strip b{font-family:var(--font-display);font-size:22px;font-weight:700;letter-spacing:-.02em}
.strip span{font-size:12px;color:var(--muted);font-weight:500}
.bar{position:sticky;top:0;z-index:4;display:flex;align-items:center;gap:8px;margin:0 -16px;padding:10px 8px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px)}
.bar h2{flex:1;font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:42px;height:42px;border-radius:21px;display:grid;place-items:center;color:var(--ink);transition:background .12s,transform .1s;flex:none}
.ib:active{background:var(--soft);transform:scale(.92)}
.section{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:22px 0 10px}
.section h3{font-size:19px;font-weight:700}
.section span{color:var(--muted);font-size:13px}

/* controls */
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 14px;height:46px;color:var(--muted)}
.search input{flex:1;border:0;background:none;outline:0;min-width:0;color:var(--ink)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:2px 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 14px;border-radius:17px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:13.5px;color:var(--muted);transition:transform .1s,background .12s}
.chip:active{transform:scale(.95)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 18px;border-radius:14px;font-weight:700;background:var(--soft);color:var(--ink);transition:transform .1s,filter .12s}
.btn:active{transform:scale(.97);filter:brightness(.96)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none;border:1px solid var(--line)}
.btn.danger{color:var(--bad)}
.btn.small{height:38px;padding:0 14px;border-radius:12px;font-size:14px}
.btn.block{width:100%}
.row-btns{display:flex;gap:10px;flex-wrap:wrap}
.row-btns .btn{flex:1}

/* cards and rows */
.list{display:flex;flex-direction:column;gap:10px}
.card{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border-radius:var(--r);padding:10px 12px 10px 10px;box-shadow:var(--shadow);transition:transform .1s}
button.card:active{transform:scale(.985)}
.thumb{flex:none;width:64px;height:64px;border-radius:14px;overflow:hidden;display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:26px;color:#fff;background:linear-gradient(140deg,hsl(var(--h) 72% 52%),hsl(calc(var(--h) + 38) 78% 44%))}
.thumb img{width:100%;height:100%;object-fit:cover}
.card .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.card .t{font-weight:700;font-size:16px;line-height:1.2;overflow-wrap:anywhere}
.card .m{color:var(--muted);font-size:13.5px;overflow-wrap:anywhere}
.tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:3px}
.tag{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:8px;background:var(--soft);color:var(--muted);white-space:nowrap}
.tag.m{background:color-mix(in srgb,var(--mc) 15%,var(--surface));color:color-mix(in srgb,var(--mc) 72%,var(--ink))}
.tag.demo{background:color-mix(in srgb,var(--gold) 22%,var(--surface));color:color-mix(in srgb,var(--gold) 55%,var(--ink))}
.tag.done{text-decoration:line-through}
.score{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.score b{font-family:var(--font-display);font-size:21px;font-weight:700;line-height:1}
.score small{font-size:11.5px;color:var(--muted);font-weight:600}
.pips{display:inline-block;flex:none;position:relative;width:60px;height:12px;background:radial-gradient(circle,var(--line) 0 4.6px,transparent 5px) 0 0/12px 12px repeat-x}
.pips i{position:absolute;inset:0 auto 0 0;background:radial-gradient(circle,var(--gold) 0 4.6px,transparent 5px) 0 0/12px 12px repeat-x}
.mtile{flex:none;width:46px;height:46px;border-radius:13px;display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:14px;letter-spacing:-.02em;
  background:color-mix(in srgb,var(--mc) 16%,var(--surface));color:color-mix(in srgb,var(--mc) 75%,var(--ink))}
.banner{display:flex;gap:12px;align-items:center;background:color-mix(in srgb,var(--gold) 16%,var(--surface));border:1px solid color-mix(in srgb,var(--gold) 40%,var(--surface));border-radius:var(--r);padding:12px 14px;font-size:14px}
.banner p{margin:0;flex:1}
.empty{text-align:center;padding:36px 20px;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty h3{font-size:20px}
.empty p{margin:0;color:var(--muted);max-width:32ch}
.day{font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:18px 2px 8px}

/* detail */
.cover{position:relative;border-radius:22px;overflow:hidden;min-height:150px;display:flex;align-items:flex-end;padding:16px;color:#fff;
  background:linear-gradient(140deg,hsl(var(--h) 72% 50%),hsl(calc(var(--h) + 38) 78% 38%))}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.62),rgba(0,0,0,0) 62%)}
.cover.photo{min-height:230px}
.cover div{position:relative;z-index:1;display:flex;flex-direction:column;gap:2px}
.cover h1{font-size:28px;font-weight:800;line-height:1.05;overflow-wrap:anywhere}
.cover span{opacity:.92;font-weight:500}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);margin-top:12px}
.facts div{background:var(--surface);padding:10px 12px;display:flex;flex-direction:column;gap:1px;min-width:0}
.facts span{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.facts b{font-weight:700;font-size:15px;overflow-wrap:anywhere}
.note{background:var(--surface);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);white-space:pre-wrap;overflow-wrap:anywhere;margin-top:12px}
.cmp{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:6px 14px}
.cmp-row{display:grid;grid-template-columns:104px 1fr 76px;gap:10px;align-items:center;padding:9px 0}
.cmp-row+.cmp-row{border-top:1px solid var(--line)}
.cmp-row .track{height:10px;border-radius:5px;background:var(--soft);overflow:hidden}
.cmp-row .track i{display:block;height:100%;border-radius:5px;background:var(--mc)}
.cmp-row .v{text-align:right;font-size:13px;color:var(--muted)}
.cmp-row .v b{color:var(--ink);font-family:var(--font-display);font-size:16px}
.big-score{display:flex;align-items:center;gap:14px;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px;margin-top:12px}
.big-score b{font-family:var(--font-display);font-size:46px;font-weight:800;line-height:1;letter-spacing:-.03em}
.big-score .pips{transform:scale(1.5);transform-origin:left center}
.photo-full{border-radius:var(--r);overflow:hidden;margin-top:12px;box-shadow:var(--shadow)}

/* sheets */
#sheet-root{position:absolute;inset:0;z-index:20;display:none}
#sheet-root.open{display:block}
.scrim{position:absolute;inset:0;background:rgba(8,12,22,.5);animation:fade .18s}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:94%;overflow:hidden;display:flex;flex-direction:column;background:var(--bg);border-radius:24px 24px 0 0;animation:up .24s cubic-bezier(.2,.9,.25,1);box-shadow:0 -10px 40px rgba(0,0,0,.25)}
.sheet.pop{left:20px;right:20px;bottom:auto;top:50%;transform:translateY(-50%);border-radius:24px;animation:pop .28s cubic-bezier(.2,1.3,.4,1)}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(40%);opacity:.6}to{transform:none;opacity:1}}
@keyframes pop{from{transform:translateY(-50%) scale(.85);opacity:.5}to{transform:translateY(-50%);opacity:1}}
.sheet-head{display:flex;align-items:center;gap:8px;padding:12px 8px 8px 20px}
.sheet-head h2{flex:1;font-size:21px;font-weight:700}
.sheet-body{flex:1;min-height:0;overflow-y:auto;padding:4px 20px 20px;display:flex;flex-direction:column;gap:16px}
.sheet-foot{padding:12px 20px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--bg);display:flex;gap:10px}
.sheet-foot .btn{flex:1}
form{display:contents}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f>label,.f>.lbl{font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.f input[type=text],.f input[type=date],.f input[type=datetime-local],.f select,.f textarea{width:100%;height:48px;padding:0 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);outline:0;transition:border-color .12s,box-shadow .12s;min-width:0}
.f textarea{height:auto;min-height:92px;padding:12px 14px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.seg{display:flex;background:var(--soft);border-radius:14px;padding:4px;gap:4px}
.seg label{flex:1;position:relative}
.seg input,.opt input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.seg span{display:grid;place-items:center;height:40px;border-radius:11px;font-weight:600;color:var(--muted);font-size:14px;transition:background .12s}
.seg input:checked+span{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg input:focus-visible+span,.opt input:focus-visible+span{outline:2.5px solid var(--accent);outline-offset:1px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{position:relative}
.opt span{display:inline-flex;align-items:center;height:38px;padding:0 13px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:14px;color:var(--muted);transition:transform .1s}
.opt:active span{transform:scale(.95)}
.opt input:checked+span{background:color-mix(in srgb,var(--mc,var(--accent)) 16%,var(--surface));border-color:var(--mc,var(--accent));color:color-mix(in srgb,var(--mc,var(--accent)) 75%,var(--ink))}
.rate{background:var(--surface);border-radius:var(--r);padding:14px 16px;border:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.rate-top{display:flex;align-items:center;justify-content:space-between}
.rate output{font-family:var(--font-display);font-size:38px;font-weight:800;line-height:1;letter-spacing:-.03em}
.rate .pips{transform:scale(1.4);transform-origin:right center}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:36px;background:none;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:10px;border-radius:5px;background:linear-gradient(to right,var(--gold) var(--p,0%),var(--soft) var(--p,0%))}
input[type=range]::-moz-range-track{height:10px;border-radius:5px;background:var(--soft)}
input[type=range]::-moz-range-progress{height:10px;border-radius:5px;background:var(--gold)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:var(--surface);border:3px solid var(--gold);margin-top:-10px;box-shadow:var(--shadow)}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:var(--surface);border:3px solid var(--gold)}
.photo-pick{display:flex;gap:12px;align-items:center}
.photo-pick .prev{width:84px;height:84px;border-radius:16px;background:var(--soft);display:grid;place-items:center;color:var(--muted);overflow:hidden;flex:none}
.photo-pick .prev img{width:100%;height:100%;object-fit:cover}
.photo-pick .acts{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.file-btn{position:relative;overflow:hidden}
.file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.hint{font-size:13px;color:var(--muted);margin:0}
.ratio{font-weight:700;color:var(--accent)}

/* badges */
.progress{height:10px;border-radius:5px;background:var(--soft);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);border-radius:5px}
.bgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.badge{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;background:var(--surface);border-radius:var(--r);padding:14px 6px 12px;box-shadow:var(--shadow);transition:transform .1s;min-width:0}
.badge:active{transform:scale(.95)}
.badge b{font-size:13px;line-height:1.15;font-weight:700}
.badge.off b{color:var(--muted)}
.lv{display:flex;gap:4px;height:6px}
.lv i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.lv i.on{background:var(--gold)}
.medal .m-bg{fill:var(--soft)}
.medal .m-ring{fill:none;stroke:var(--line);stroke-width:1.5}
.medal .m-ic{fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.medal.on .m-bg{fill:var(--c)}
.medal.on .m-ring{stroke:rgba(255,255,255,.5)}
.medal.on .m-ic{stroke:#fff}
.won{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:26px 22px 8px}
.won .medal{animation:spin .7s cubic-bezier(.2,1.4,.4,1)}
@keyframes spin{from{transform:scale(.3) rotate(-90deg)}to{transform:none}}
.won small{font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.1em;font-size:12px}
.won h2{font-size:26px;font-weight:800}
.won p{margin:0;color:var(--muted)}

.panel{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:12px}
.panel h3{font-size:17px}
.panel p{margin:0;color:var(--muted);font-size:14px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:14.5px}
.kv:first-of-type{border-top:0}
.kv span{color:var(--muted)}
.kv b{text-align:right;overflow-wrap:anywhere}
.status{display:flex;gap:10px;align-items:center;font-size:13.5px;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--good);flex:none}
.dot.warn{background:var(--gold)}

.adv{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:0 14px}
.adv summary{height:50px;display:flex;align-items:center;font-weight:700;cursor:pointer;list-style:none}
.adv summary::-webkit-details-marker{display:none}
.adv summary::after{content:"+";margin-left:auto;font-size:22px;font-weight:500;color:var(--muted)}
.adv[open] summary::after{content:"–"}
.adv-body{display:flex;flex-direction:column;gap:10px;padding-bottom:14px}
.stage{display:grid;grid-template-columns:66px 70px 1fr 36px;gap:8px;align-items:center}
.stage.hd{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.stage input,.add-row input{height:44px;padding:0 10px;border-radius:12px;border:1px solid var(--line);background:var(--bg);min-width:0;width:100%;outline:0}
.stage input:focus,.add-row input:focus{border-color:var(--accent)}
.stage .ib{width:36px;height:36px;color:var(--muted)}
.add-row{display:flex;gap:8px}
.add-row[hidden]{display:none}
.add-row .btn{flex:none}
[hidden]{display:none!important}
.tick{display:flex;align-items:center;gap:10px;font-weight:600;min-height:32px;cursor:pointer}
.tick input{width:22px;height:22px;margin:0;accent-color:var(--accent);flex:none}
#adv-wrap,#c-more-box{display:flex;flex-direction:column;gap:16px}
.opt-add{display:inline-flex;align-items:center;height:38px;padding:0 13px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:14px;color:var(--muted);transition:transform .1s}
.opt-add:active{transform:scale(.95)}
#extras-box{display:contents}
.wide{grid-column:1/-1}
.kv{flex-wrap:wrap}
#editor{position:absolute;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column}
.ed-stage{flex:1;min-height:0;display:grid;place-items:center;background:#0A0E17;padding:16px;overflow:hidden}
.ed-stage canvas{touch-action:none;cursor:grab;border-radius:6px;box-shadow:0 0 0 2px rgba(255,255,255,.85)}
.ed-tools{padding:12px 20px 2px}
.ed-zoom{display:flex;align-items:center;gap:12px;font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.ed-zoom output{min-width:38px;text-align:right;color:var(--ink);font-variant-numeric:tabular-nums}
input[type=range].plain::-webkit-slider-runnable-track{background:var(--soft)}
input[type=range].plain::-moz-range-progress{background:none}
.ed-hint{color:rgba(255,255,255,.75);font-size:13px;text-align:center;margin:0;padding:0 16px 14px;background:#0A0E17}
.roast-top{display:flex;justify-content:space-between;align-items:baseline}
.roast-top output{font-weight:700}
.roast-top label{font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
input[type=range].roast::-webkit-slider-runnable-track{background:linear-gradient(to right,var(--soft) 0 8%,#E2B77E 14%,#B8742F 55%,#4A2410 100%)}
input[type=range].roast::-moz-range-track{background:linear-gradient(to right,var(--soft) 0 8%,#E2B77E 14%,#B8742F 55%,#4A2410 100%)}
input[type=range].roast::-moz-range-progress{background:none}
input[type=range].roast::-webkit-slider-thumb{border-color:var(--ink)}
input[type=range].roast::-moz-range-thumb{border-color:var(--ink)}
.roast-ticks{position:relative;height:18px;margin:0 15px;font-size:12px;font-weight:600;color:var(--muted)}
.roast-ticks span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.roast-ticks span:first-child{transform:translateX(-15px)}
.roast-ticks span:last-child{transform:translateX(calc(-100% + 15px))}
#toasts{position:absolute;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:14px;font-weight:600;font-size:14px;box-shadow:var(--shadow);animation:rise .2s}
.loading{display:grid;place-items:center;height:60%;color:var(--muted);text-align:center;gap:12px;padding:40px 20px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
"use strict";
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);

const avg=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:null;
const hue=s=>{let h=0;for(const ch of String(s))h=(h*31+ch.charCodeAt(0))%360;return h};
const fmtDay=s=>{const d=new Date(dayOf(s)+"T12:00");if(isNaN(d))return "";const t=dayOf(localStamp());const y=dayOf(localStamp(new Date(Date.now()-864e5)));
  if(dayOf(s)===t)return "Today";if(dayOf(s)===y)return "Yesterday";return d.toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short",year:d.getFullYear()===new Date().getFullYear()?undefined:"numeric"})};
const okDate=x=>/^\d{4}-\d\d-\d\d/.test(x||"")?x.slice(0,10):"";
const fmtDate=s=>{if(!s)return "–";const d=new Date(dayOf(s)+"T12:00");return isNaN(d)?"–":d.toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"})};

const I={
 cup:'<path d="M4 9h13v4a6 6 0 0 1-6 6h-1a6 6 0 0 1-6-6z"/><path d="M17 10h1.5a2.5 2.5 0 0 1 0 5H16.6"/><path d="M8 3v3M12 3v3"/>',

 down:'<path d="M12 4v11M7 11l5 5 5-5M5 20h14"/>', up:'<path d="M12 16V5M7 9l5-5 5 5M5 20h14"/>',

 sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/>',
 pen:'<path d="M4 20l1-5L16 4l4 4L9 19z"/><path d="M4 20h16"/>',

 box:'<path d="M4 8l8-4 8 4v9l-8 4-8-4z"/><path d="M4 8l8 4 8-4M12 12v9"/>',

 heart:'<path d="M12 20s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.5 4.3 4.3 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10z"/>'
};
const ic=(n,s=22)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[n]||""}</svg>`;

/* ---------- domain ---------- */
const METHODS=[
 {id:"espresso",name:"Espresso",ab:"ES",c:"#D6334C",dose:18,water:36,temp:93,time:"0:28",out:"Yield"},
 {id:"v60",name:"Pour-over",ab:"V60",c:"#1E88E5",dose:15,water:250,temp:94,time:"2:45",pour:true},
 {id:"aeropress",name:"AeroPress",ab:"AP",c:"#F47B20",dose:15,water:220,temp:88,time:"2:00"},
 {id:"frenchpress",name:"French press",ab:"FP",c:"#1F9D6B",dose:30,water:500,temp:95,time:"4:00"},
 {id:"moka",name:"Moka pot",ab:"MK",c:"#7A4FD6",dose:16,water:150,temp:null,time:"4:00"},
 {id:"chemex",name:"Chemex",ab:"CX",c:"#0FA3B1",dose:30,water:500,temp:94,time:"4:15",pour:true},
 {id:"batch",name:"Filter machine",ab:"FM",c:"#5B6B8C",dose:60,water:1000,temp:null,time:""},
 {id:"coldbrew",name:"Cold brew",ab:"CB",c:"#2F6BD9",dose:80,water:1000,temp:null,time:""},
 {id:"cezve",name:"Cezve",ab:"CZ",c:"#B8741A",dose:8,water:70,temp:null,time:"2:30"},
 {id:"other",name:"Other",ab:"··",c:"#8A93A3",dose:null,water:null,temp:null,time:""}
];
const MCOLORS=["#C2187A","#0B8A6B","#B4530A","#4457D6","#8E3FBF","#00838F","#A33B2A","#5A7D0C"];
const customs=()=>S.meta.methods||[];
const allMethods=()=>[...METHODS.slice(0,-1),...customs(),METHODS[METHODS.length-1]];
const M=id=>METHODS.find(m=>m.id===id)||customs().find(m=>m.id===id)||METHODS[METHODS.length-1];
const abbr=n=>{const w=n.replace(/[^A-Za-z0-9 ]/g,"").split(/\s+/).filter(Boolean);return((w.length>1?w.map(x=>x[0]).join(""):(w[0]||"?")).slice(0,3)).toUpperCase()};
function normMethod(o){o=o||{};const name=str(o.name,30);return{id:/^x[a-z0-9]{6,24}$/.test(o.id||"")?o.id:"x"+newId(),name,ab:abbr(name),c:/^#[0-9a-fA-F]{6}$/.test(o.c||"")?o.c:MCOLORS[0],pour:!!o.pour}}
/* extra options per method; pouring stages are separate and only for methods with pour:true */
const ADV={
 espresso:[{k:"preinf",l:"Pre-infusion (s)",t:"num",max:120},{k:"bar",l:"Pressure (bar)",t:"num",max:20}],
 aeropress:[{k:"pos",l:"Position",t:"seg",o:["Standard","Inverted"]},{k:"steep",l:"Steep before pressing",t:"text",ph:"1:30"}],
 coldbrew:[{k:"hours",l:"Steep time (hours)",t:"num",max:200},{k:"where",l:"Steeped in",t:"seg",o:["Fridge","Room temp"]}],
 moka:[{k:"start",l:"Water in the base",t:"seg",o:["Cold","Pre-heated"]}]
};
function normExtra(method,e){const out={};e=e&&typeof e==="object"?e:{};
  if(M(method).id!==method)return keepExtra(e,{}); /* a method this version does not know: keep its options untouched */
  (ADV[M(method).id]||[]).forEach(d=>{const v=e[d.k];
  if(d.t==="num"){const n=num(v,0,d.max);if(n!=null)out[d.k]=n}else if(d.t==="seg"){if(d.o.includes(v))out[d.k]=v}else{const t=str(v,20);if(t)out[d.k]=t}});return out}
const normStages=l=>Array.isArray(l)?l.slice(0,12).map(x=>({t:str(x&&x.t,8),g:num(x&&x.g,0,50000),note:str(x&&x.note,40)})).filter(x=>x.t||x.g!=null||x.note):[];
const FLAVORS=["Chocolate","Cocoa","Caramel","Honey","Brown sugar","Vanilla","Nutty","Hazelnut","Almond","Berry","Blueberry","Strawberry","Cherry","Citrus","Lemon","Orange","Stone fruit","Apple","Tropical","Floral","Jasmine","Black tea","Spicy","Earthy","Smoky","Winey","Creamy","Bright","Juicy","Bitter","Sour","Flat"];
const ROASTV=["","light","medium-light","medium","medium-dark","dark"];
const ROASTN=["Unknown","Light","Medium-light","Medium","Medium-dark","Dark"];
const PROCESSES=["","Washed","Natural","Honey","Anaerobic","Wet-hulled","Decaf","Blend / unknown"];
const ORIGINS=["Brazil","Burundi","Colombia","Costa Rica","DR Congo","Ecuador","El Salvador","Ethiopia","Guatemala","Honduras","India","Indonesia","Kenya","Mexico","Nicaragua","Panama","Peru","Rwanda","Tanzania","Uganda","Vietnam","Yemen","Blend"];

/* ---------- data format ----------
   SCHEMA is the version of the stored data and of export files. Rules that keep old and new data compatible:
   1. New fields are optional and get a default in normCoffee / normBrew, so old records load unchanged.
   2. Fields, methods, flavours and badges this version does not know are kept as they are, so data written
      by a newer version survives being opened, edited and exported here.
   3. A change that renames or reshapes existing fields raises SCHEMA and adds a step to MIGRATIONS;
      stored data and imported files are upgraded step by step from whatever version they have. */
const SCHEMA=1;
const MIGRATIONS={ /* 2:{coffee:c=>c,brew:b=>b} */ };
function upgrade(kind,rec,from){let r=rec;for(let v=from+1;v<=SCHEMA;v++){const m=MIGRATIONS[v];if(m&&m[kind])r=m[kind]({...r})}return r}
function keepExtra(o,out){let n=0;for(const[key,v]of Object.entries(o||{})){
    if(key in out||key==="demo"||key==="k"||!/^[A-Za-z][A-Za-z0-9]{0,30}$/.test(key))continue;
    let j;try{j=JSON.stringify(v)}catch(e){continue}if(j===undefined||j.length>2000||++n>20)continue;out[key]=JSON.parse(j)}
  return out}
function normCoffee(o){o=o||{};return keepExtra(o,{k:"coffee",id:okId(o.id)?o.id:newId(),name:str(o.name,80),roaster:str(o.roaster,60),origin:str(o.origin,60),
  process:str(o.process,40),roast:ROASTV.includes(o.roast)?o.roast:"",
  form:o.form==="ground"?"ground":"beans",roastDate:/^\d{4}-\d\d-\d\d$/.test(o.roastDate||"")?o.roastDate:"",bought:/^\d{4}-\d\d-\d\d$/.test(o.bought||"")?o.bought:"",
  weight:num(o.weight,1,100000),price:num(o.price,0,100000),notes:str(o.notes,2000),photoId:okId(o.photoId)?o.photoId:null,
  region:str(o.region,60),producer:str(o.producer,60),variety:str(o.variety,60),altitude:num(o.altitude,0,5000),
  roastFor:["filter","espresso","omni"].includes(o.roastFor)?o.roastFor:"",roasterNotes:str(o.roasterNotes,120),finished:!!o.finished,createdAt:Number(o.createdAt)||Date.now()})}
function normBrew(o){o=o||{};const r=num(o.rating,0.25,5);return keepExtra(o,{k:"brew",id:okId(o.id)?o.id:newId(),coffeeId:String(o.coffeeId||""),method:typeof o.method==="string"&&/^[a-z0-9]{2,30}$/.test(o.method)?o.method:"other",
  date:/^\d{4}-\d\d-\d\dT\d\d:\d\d/.test(o.date||"")?o.date.slice(0,16):localStamp(),dose:num(o.dose,0.1,5000),water:num(o.water,1,50000),
  temp:num(o.temp,0,100),time:str(o.time,12),grind:str(o.grind,40),rating:r==null?null:Math.round(r*4)/4,
  flavors:Array.isArray(o.flavors)?o.flavors.filter(f=>typeof f==="string"&&f.length>0&&f.length<=30).slice(0,16):[],stages:normStages(o.stages),extra:normExtra(o.method,o.extra),notes:str(o.notes,2000),photoId:okId(o.photoId)?o.photoId:null})}
const okPhoto=d=>typeof d==="string"&&/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(d)&&d.length<240000;

/* ---------- state ---------- */
const S={coffees:{},brews:{},photos:{},meta:{badges:{},exports:0,demoOff:false,methods:[],schema:SCHEMA},demo:false,ready:false};
const ui={q:"",filter:"all",jm:"all"};
const coffees=()=>Object.values(S.coffees);
const brews=()=>Object.values(S.brews);
const brewsOf=id=>brews().filter(b=>b.coffeeId===id).sort((a,b)=>b.date.localeCompare(a.date));
const rated=l=>l.filter(b=>b.rating!=null).map(b=>b.rating);
const ratio=b=>b.dose&&b.water?"1:"+fmtNum(b.water/b.dose,1):null;

/* ---------- storage: private per-person cloud docs, else this browser ---------- */
const Store={
  mode:"memory",col:null,idb:null,q:{},
  async init(){
    const use=n=>window.claude&&typeof window.claude.use==="function"?window.claude.use(n).catch(()=>null):Promise.resolve(null);
    try{
      const[db,user]=await Promise.all([use("db"),use("user")]);this.db=db;this.user=user;
      const uid=user?await user.id():null;
      if(db&&uid){
        this.col=db.collection("data/users/"+uid);
        const snap=await Promise.race([this.col.get(),new Promise((_,rej)=>setTimeout(()=>rej({code:"timeout"}),10000))]);
        const out={};snap.docs.forEach(d=>{if(d.exists)out[d.id]=JSON.parse(JSON.stringify(d.data()))});
        let canWrite=true;
        if(!Object.keys(out).length){try{await this.col.doc("meta").set({k:"meta",badges:{},exports:0,demoOff:false,methods:[]})}catch(e){canWrite=false}}
        if(canWrite){this.mode="cloud";return out}
        this.col=null; /* this viewer may not save to the page: keep their data in this browser instead */
      }
    }catch(e){if(this.col){this.col=null;return null}}
    try{
      this.idb=await new Promise((res,rej)=>{const r=indexedDB.open("beanbook",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);r.onblocked=()=>rej(0);setTimeout(()=>rej(0),4000)});
      const out=await new Promise((res,rej)=>{const o={};const c=this.idb.transaction("kv").objectStore("kv").openCursor();
        c.onsuccess=()=>{const cur=c.result;if(cur){o[cur.key]=cur.value;cur.continue()}else res(o)};c.onerror=()=>rej(c.error)});
      this.mode="local";return out;
    }catch(e){this.mode="memory";return{}}
  },
  run(key,fn){this.q[key]=(this.q[key]||Promise.resolve()).then(fn).catch(e=>{
    toast(e&&e.code==="quota_exceeded"?"Storage is full. Remove some photos or old entries.":"Could not save that change. Export a backup to be safe.")});return this.q[key]},
  put(key,body){const b=JSON.parse(JSON.stringify(body));
    if(this.mode==="cloud")return this.run(key,()=>this.col.doc(key).set(b));
    if(this.mode==="local")return this.run(key,()=>new Promise((res,rej)=>{const t=this.idb.transaction("kv","readwrite");t.objectStore("kv").put(b,key);t.oncomplete=res;t.onerror=()=>rej(t.error)}));
    return Promise.resolve()},
  del(key){
    if(this.mode==="cloud")return this.run(key,()=>this.col.doc(key).delete());
    if(this.mode==="local")return this.run(key,()=>new Promise((res,rej)=>{const t=this.idb.transaction("kv","readwrite");t.objectStore("kv").delete(key);t.oncomplete=res;t.onerror=()=>rej(t.error)}));
    return Promise.resolve()}
};
const saveMeta=()=>Store.put("meta",{k:"meta",...S.meta});
function addPhoto(data){const id=newId();S.photos[id]=data;Store.put("p_"+id,{k:"photo",d:data});return id}
function delPhoto(id){if(id&&S.photos[id]){delete S.photos[id];Store.del("p_"+id)}}

function hydrate(docs){
  S.coffees={};S.brews={};S.photos={};
  const mv=docs&&docs.meta,from=Math.max(1,Number(mv&&mv.schema)||1);
  if(mv&&typeof mv==="object")S.meta=keepExtra(mv,{badges:(mv.badges&&typeof mv.badges==="object")?JSON.parse(JSON.stringify(mv.badges)):{},exports:Number(mv.exports)||0,demoOff:!!mv.demoOff,
    methods:Array.isArray(mv.methods)?mv.methods.map(normMethod).filter(m=>m.name).slice(0,40):[],schema:Math.max(SCHEMA,from)});
  for(const[key,v]of Object.entries(docs||{})){
    if(!v||typeof v!=="object"||key==="meta")continue;
    if(key.startsWith("c_")){const c=normCoffee({...upgrade("coffee",v,from),id:key.slice(2)});S.coffees[c.id]=c}

  }

}

async function readPhoto(file){
  const url=URL.createObjectURL(file);
  try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    let max=1000,q=.8,out="";
    for(let n=0;n<7;n++){const s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const cv=document.createElement("canvas");
      cv.width=Math.max(1,Math.round(img.naturalWidth*s));cv.height=Math.max(1,Math.round(img.naturalHeight*s));cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
      out=cv.toDataURL("image/jpeg",q);if(out.length<180000)break;max*=.8;q-=.05}
    return okPhoto(out)?out:null}catch(e){return null}finally{URL.revokeObjectURL(url)}
}

const edScale=()=>{const{bw,bh}=edBox(),i=ED.img;return Math.max(bw/i.naturalWidth,bh/i.naturalHeight)*ED.zoom};
function edClamp(){ /* keep the frame inside the photo at any angle */
  const a=edAng(),c=Math.cos(a),n=Math.sin(a),i=ED.img,sc=edScale(),{bw,bh}=edBox(),mx=Math.max(0,(i.naturalWidth*sc-bw)/2),my=Math.max(0,(i.naturalHeight*sc-bh)/2);
  let ux=ED.tx*c+ED.ty*n,uy=-ED.tx*n+ED.ty*c;ux=Math.min(mx,Math.max(-mx,ux));uy=Math.min(my,Math.max(-my,uy));ED.tx=ux*c-uy*n;ED.ty=ux*n+uy*c}
function edPaint(ctx,k){const i=ED.img,sc=edScale();ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle="#000";ctx.fillRect(0,0,ctx.canvas.width,ctx.canvas.height);
  ctx.setTransform(k,0,0,k,0,0);ctx.translate(ED.W/2+ED.tx,ED.H/2+ED.ty);ctx.rotate(edAng());ctx.scale(sc,sc);ctx.drawImage(i,-i.naturalWidth/2,-i.naturalHeight/2)}
function edDraw(){const cv=$("#ed-canvas");if(!cv)return;edClamp();edPaint(cv.getContext("2d"),cv.width/ED.W);
}
function edLayout(){const st=$("#ed-stage"),cv=$("#ed-canvas");if(!st||!cv)return;const{rw,rh}=edDims();
  const asp=ED.asp==="orig"?rw/rh:{"1":1,"4:3":4/3,"3:4":3/4}[ED.asp],aw=Math.max(80,st.clientWidth-32),ah=Math.max(80,st.clientHeight-32);
  let W=aw,H=W/asp;if(H>ah){H=ah;W=H*asp}ED.W=W;ED.H=H;const dpr=Math.min(2,window.devicePixelRatio||1);
  cv.style.width=W+"px";cv.style.height=H+"px";cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  editor.querySelectorAll("[data-act=ed-asp]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.id===ED.asp));edDraw()}
function closeEditor(){editor.hidden=true;editor.innerHTML="";if(ED.url){URL.revokeObjectURL(ED.url);ED.url=null}ED.img=null;ED.ptrs.clear()}
async function openEditor(src,isUrl){
  let img;try{img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src})}
  catch(e){if(isUrl)URL.revokeObjectURL(src);toast("That image could not be read. Try a JPEG or PNG.");return}
  Object.assign(ED,{img,ang:0,rot:0,asp:"1",zoom:1,tx:0,ty:0,url:isUrl?src:null});ED.ptrs.clear();
  editor.innerHTML=`<div class="sheet-head"><h2>Move and scale</h2><button class="ib" type="button" data-act="ed-rot" data-id="90" aria-label="Rotate">${ic("rot")}</button></div>
    <div class="ed-stage" id="ed-stage"><canvas id="ed-canvas" aria-label="Photo preview. Drag to move, pinch to zoom."></canvas></div>
    <p class="ed-hint">Drag to move, pinch to zoom</p>
    <div class="ed-tools"><label class="ed-zoom" for="ed-ang"><span>Rotate</span><input class="plain" id="ed-ang" type="range" min="-45" max="45" step="1" value="0"><output id="ed-ang-out" for="ed-ang">0°</output></label></div>
    <div class="sheet-foot"><button class="btn" type="button" data-act="ed-cancel">Cancel</button><button class="btn primary" type="button" data-act="ed-done">Done</button></div>`;
  editor.hidden=false;
  const cv=$("#ed-canvas"),P=ED.ptrs,dist=()=>{const[p,q]=[...P.values()];return Math.hypot(p.x-q.x,p.y-q.y)||1};
  cv.addEventListener("pointerdown",e=>{try{cv.setPointerCapture(e.pointerId)}catch(x){}P.set(e.pointerId,{x:e.clientX,y:e.clientY})});
  cv.addEventListener("pointermove",e=>{const p=P.get(e.pointerId);if(!p)return;
    if(P.size===1){ED.tx+=e.clientX-p.x;ED.ty+=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY}
    else if(P.size===2){const d0=dist();p.x=e.clientX;p.y=e.clientY;ED.zoom=Math.min(4,Math.max(1,ED.zoom*dist()/d0))}
    edDraw()});
  cv.addEventListener("wheel",e=>{e.preventDefault();ED.zoom=Math.min(4,Math.max(1,ED.zoom*(e.deltaY<0?1.08:.93)));edDraw()},{passive:false});
  const up=e=>P.delete(e.pointerId);cv.addEventListener("pointerup",up);cv.addEventListener("pointercancel",up);
  edLayout();
}
function edDone(){
  const cv=document.createElement("canvas"),ctx=cv.getContext("2d");let k=Math.min(1000/Math.max(ED.W,ED.H),1/edScale()),q=.82,out="";
  for(let n=0;n<8;n++){cv.width=Math.max(1,Math.round(ED.W*k));cv.height=Math.max(1,Math.round(ED.H*k));edPaint(ctx,cv.width/ED.W);out=cv.toDataURL("image/jpeg",q);if(out.length<180000)break;k*=.82;q-=.05}
  if(!okPhoto(out)){toast("That photo could not be saved. Try another one.");return}
  formPhoto={data:out,changed:true};closeEditor();refreshPhotoField();
}
addEventListener("resize",()=>{if(!editor.hidden)edLayout()});
function refreshPhotoField(){const el=$(".photo-pick",sheetRoot);if(el){const t=document.createElement("div");t.innerHTML=photoField();el.closest(".f").replaceWith(t.firstElementChild)}}

/* ---------- mutations ---------- */
function applyPhoto(old,obj){if(!formPhoto.changed)return;if(old&&old.photoId)delPhoto(old.photoId);obj.photoId=formPhoto.data?addPhoto(formPhoto.data):null}
function saveCoffee(f){
  const fd=new FormData(f),old=S.coffees[f.dataset.id];
  if(!str(fd.get("name"))){toast("Give the coffee a name first.");f.name.focus();return}
  if(!old&&S.demo){dropDemo();toast("Examples cleared. This is your shelf now.")}
  const c=normCoffee({...(old||{}),id:old?old.id:newId(),name:fd.get("name"),roaster:fd.get("roaster"),origin:fd.get("origin"),form:fd.get("form"),roast:ROASTV[Number(fd.get("roastIdx"))||0],
    process:fd.get("process")==="__custom"?fd.get("processCustom"):fd.get("process"),region:fd.get("region"),producer:fd.get("producer"),variety:fd.get("variety"),altitude:fd.get("altitude"),roastFor:fd.get("roastFor"),roasterNotes:fd.get("roasterNotes"),roastDate:fd.get("roastDate"),bought:fd.get("bought"),weight:fd.get("weight"),price:fd.get("price"),notes:fd.get("notes")});
  applyPhoto(old,c);S.coffees[c.id]=c;Store.put("c_"+c.id,c);closeSheet();
  if(old)render();else go("coffee-"+c.id);checkBadges();
}
function saveBrew(f){
  const fd=new FormData(f),old=S.brews[f.dataset.id],cid=f.dataset.coffee;if(!S.coffees[cid])return;
  const b=normBrew({...(old||{}),id:old?old.id:newId(),coffeeId:cid,method:fd.get("method"),date:fd.get("date"),dose:fd.get("dose"),water:fd.get("water"),temp:fd.get("temp"),
    time:fd.get("time"),grind:fd.get("grind"),stages:M(fd.get("method")).pour?fd.getAll("st-t").map((t,i)=>({t,g:fd.getAll("st-g")[i],note:fd.getAll("st-n")[i]})):[],
    extra:Object.fromEntries((ADV[M(fd.get("method")).id]||[]).map(d=>[d.k,fd.get("ex-"+d.k)])),rating:Number(fd.get("rating"))||null,flavors:fd.getAll("flavors"),notes:fd.get("notes")});
  applyPhoto(old,b);S.brews[b.id]=b;Store.put("b_"+b.id,b);closeSheet();
  if(old)render();else{go("coffee-"+cid);toast("Preparation saved")}checkBadges();
}
function delBrew(id){const b=S.brews[id];if(!b)return;delPhoto(b.photoId);delete S.brews[id];Store.del("b_"+id)}
function delCoffee(id){const c=S.coffees[id];if(!c)return;brewsOf(id).forEach(b=>delBrew(b.id));delPhoto(c.photoId);delete S.coffees[id];Store.del("c_"+id)}

/* ---------- export / import ---------- */
async function doExport(){
  if(S.demo||!coffees().length){toast("Nothing to export yet. Add a coffee first.");return}
  const data=JSON.stringify({format:"beanbook",version:SCHEMA,app:"Beanbook",exportedAt:new Date().toISOString(),exportedAtLocal:localStamp(),
    coffees:coffees().map(({k,...c})=>c),brews:brews().map(({k,...b})=>b),photos:S.photos,badges:S.meta.badges,methods:customs()},null,1);
  const filename=`beanbook-${localStamp().replace("T","-").replace(":","")}.json`;let ok=false;
  try{const dl=window.claude&&window.claude.use?await window.claude.use("downloads"):null;
    if(dl){await dl.save({filename,data});ok=true}
    else{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"application/json"}));a.download=filename;document.body.append(a);a.click();a.remove();ok=true}
  }catch(e){toast(e&&e.code==="declined"?"Export cancelled.":"Export is not available in this view. Open the page in a browser and try again.");return}
  if(ok){S.meta.exports=(S.meta.exports||0)+1;saveMeta();toast("Export ready: "+filename);render();checkBadges()}
}
let pendingImport=null;
async function readImport(file){
  let o;try{o=JSON.parse(await file.text())}catch(e){toast("That file is not a Beanbook export.");return}
  if(!o||o.format!=="beanbook"||!Array.isArray(o.coffees)||!Array.isArray(o.brews)){toast("That file is not a Beanbook export.");return}
  (Array.isArray(o.methods)?o.methods:[]).slice(0,40).map(normMethod).forEach(m=>{if(m.name&&!customs().some(x=>x.id===m.id))S.meta.methods=[...customs(),m]});
  const from=Math.max(1,Number(o.version)||1);
  const map={},pmap={},photos={};
  Object.entries(o.photos&&typeof o.photos==="object"?o.photos:{}).forEach(([id,d])=>{if(okPhoto(d)){const nid=okId(id)?id:newId();pmap[id]=nid;photos[nid]=d}});
  const cs=o.coffees.slice(0,5000).filter(c=>c&&str(c.name)).map(c=>{const n=normCoffee({...upgrade("coffee",c,from),photoId:pmap[c.photoId]});map[c.id]=n.id;return n});
  const bs=o.brews.slice(0,20000).filter(b=>b&&map[b.coffeeId]).map(b=>normBrew({...upgrade("brew",b,from),coffeeId:map[b.coffeeId],photoId:pmap[b.photoId]}));
  pendingImport={cs,bs,photos,badges:o.badges&&typeof o.badges==="object"?o.badges:{}};
  const mine=S.demo?0:coffees().length;
  openSheet(`${head("Import data")}<div class="sheet-body"><p class="hint" style="font-size:15px">This file holds <b style="color:var(--ink)">${cs.length} coffees</b> and <b style="color:var(--ink)">${bs.length} preparations</b>${Object.keys(photos).length?` with ${Object.keys(photos).length} photos`:""}.</p>
    ${from>SCHEMA?`<p class="hint">This file was made by a newer version of Beanbook. Everything is imported. Details this version does not know are kept, but not shown.</p>`:""}
    ${o.exportedAtLocal||o.exportedAt?`<p class="hint">Exported ${esc(fmtDate(o.exportedAtLocal||o.exportedAt))}${/T\d\d:\d\d/.test(o.exportedAtLocal||"")?" at "+esc(o.exportedAtLocal.slice(11,16)):""}.</p>`:""}
    ${mine?`<p class="hint">You already have ${mine} coffees here. Merge keeps them and adds the file. Replace deletes what is here first.</p>`:""}</div>
    <div class="sheet-foot">${mine?`<button class="btn" type="button" data-act="import-replace">Replace</button><button class="btn primary" type="button" data-act="import-merge">Merge</button>`:`<button class="btn primary" type="button" data-act="import-merge">Import</button>`}</div>`);
}
function wipe(){Object.keys(S.coffees).forEach(id=>S.demo?0:delCoffee(id));Object.keys(S.photos).forEach(delPhoto);S.coffees={};S.brews={};S.demo=false}
function runImport(replace){
  const p=pendingImport;pendingImport=null;if(!p)return;
  if(replace)wipe();else dropDemo();
  Object.entries(p.photos).forEach(([id,d])=>{S.photos[id]=d;Store.put("p_"+id,{k:"photo",d})});
  p.cs.forEach(c=>{S.coffees[c.id]=c;Store.put("c_"+c.id,c)});p.bs.forEach(b=>{S.brews[b.id]=b;Store.put("b_"+b.id,b)});
  Object.entries(p.badges).forEach(([id,x])=>{if(!BADGES.some(b=>b.id===id)&&!S.meta.badges[id]&&/^[a-z0-9]{2,30}$/.test(id)&&x&&Number(x.level)>0)S.meta.badges[id]={level:Number(x.level)|0,at:okDate(x.at)}});
  BADGES.forEach(b=>{const x=p.badges[b.id];if(x&&Number(x.level)>((S.meta.badges[b.id]||{}).level||0))S.meta.badges[b.id]={level:Math.min(b.goals.length,Number(x.level)|0),at:/^\d{4}-\d\d-\d\d$/.test(x.at||"")?x.at:dayOf(localStamp())}});
  saveMeta();closeSheet();go("coffees");toast(`Imported ${p.cs.length} coffees and ${p.bs.length} preparations`);checkBadges(true);
}

/* ---------- events ---------- */
const ACT={
  tab:id=>go(id),open:id=>go(id),"close-sheet":()=>closeSheet(),
  fab:()=>{const d=fab.dataset.do;ACT[d]&&ACT[d](fab.dataset.id)},
  "add-coffee":()=>coffeeForm(),"edit-coffee":id=>coffeeForm(S.coffees[id]),
  "add-brew":id=>brewForm(id),"edit-brew":id=>{const b=S.brews[id];b&&brewForm(b.coffeeId,b)},again:id=>{const b=S.brews[id];b&&brewForm(b.coffeeId,b,true)},
  "pick-coffee":()=>{const l=coffees().sort((a,b)=>(a.finished-b.finished)||(b.createdAt-a.createdAt));
    openSheet(`${head("Which coffee?")}<div class="sheet-body"><div class="list">${l.map(c=>`<button class="card" type="button" data-act="add-brew" data-id="${c.id}">${thumb(c)}<span class="body"><span class="t">${esc(c.name)}</span><span class="m">${esc([c.roaster,c.finished?"Finished":""].filter(Boolean).join(" · "))}</span></span></button>`).join("")}</div></div>`)},
  filter:id=>{ui.filter=id;render()},jm:id=>{ui.jm=id;render()},
  "clear-demo":()=>{dropDemo();S.meta.demoOff=true;saveMeta();render()},
  "toggle-finished":id=>{const c=S.coffees[id];if(!c)return;c.finished=!c.finished;Store.put("c_"+id,c);render();toast(c.finished?"Bag marked finished":"Bag reopened");checkBadges()},
  "ask-del-coffee":id=>{const n=brewsOf(id).length;confirmSheet("Delete this coffee?",n?`Its ${n} preparation${n===1?"":"s"} and photos are deleted too. This cannot be undone.`:"This cannot be undone.","Delete","del-coffee",id)},
  "del-coffee":id=>{delCoffee(id);closeSheet();go("coffees");toast("Coffee deleted")},
  "ask-del-brew":id=>confirmSheet("Delete this preparation?","This cannot be undone.","Delete","del-brew",id),
  "del-brew":id=>{const b=S.brews[id];const back=b&&S.coffees[b.coffeeId]?"coffee-"+b.coffeeId:"journal";delBrew(id);closeSheet();go(back);toast("Preparation deleted")},
  "photo-edit":()=>{formPhoto.data&&openEditor(formPhoto.data)},
  "ed-cancel":()=>closeEditor(),"ed-done":()=>edDone(),
  "ed-rot":id=>{ED.rot=(ED.rot+Number(id)+360)%360;ED.tx=ED.ty=0;edLayout()},
  "ed-asp":id=>{ED.asp=id;ED.tx=ED.ty=0;edLayout()},
  "photo-clear":()=>{formPhoto={data:null,changed:true};refreshPhotoField()},
  badge:id=>{const b=BADGES.find(x=>x.id===id),f=facts(),have=S.meta.badges[id]||{},lvl=have.level||0,val=f?f[b.key]||0:0,next=b.goals[lvl];
    openSheet(`<div class="won">${medal(b,lvl,104)}<small>${lvl?(b.goals.length>1?"Level "+lvl+" of "+b.goals.length:"Earned"):"Locked"}</small><h2>${esc(b.name)}</h2><p>${esc(b.what)}</p>
      ${next?`<div style="width:100%"><div class="progress"><i style="width:${Math.min(100,val/next*100)}%"></i></div><p class="num" style="margin-top:8px;font-size:13.5px">${val} of ${next} ${esc(b.unit||"")}${lvl?" for the next level":""}</p></div>`:""}
      ${have.at?`<p style="font-size:13.5px">Earned ${esc(fmtDate(have.at))}</p>`:""}</div><div class="sheet-foot"><button class="btn" type="button" data-act="close-sheet">Close</button></div>`,{pop:true})},
  "new-method":()=>{const r=$("#new-method-row");r.hidden=!r.hidden;if(!r.hidden)$("#new-method-name").focus()},
  "add-method":()=>addMethod(),
  "pour-method":id=>{S.meta.methods=customs().map(m=>m.id===id?{...m,pour:!m.pour}:m);saveMeta();render()},
  "del-method":id=>{const n=brews().filter(b=>b.method===id).length;if(n){toast(`Used by ${n} preparation${n===1?"":"s"}. Change or delete those first.`);return}
    S.meta.methods=customs().filter(m=>m.id!==id);saveMeta();render()},
  "stage-add":()=>{$("#stage-list").insertAdjacentHTML("beforeend",stageRow());const l=$("#stage-list").lastElementChild;l&&l.querySelector("input").focus()},
  "stage-del":(id,el)=>el.closest(".stage").remove(),
  "stage-preset":()=>{const f=$("#brew-form"),d=num(f.dose.value,0.1,5000),w=num(f.water.value,1,50000);if(!w){toast("Fill in the water amount first.");return}
    const bloom=Math.round(Math.min(w*.25,d?d*3:w*.15));
    $("#stage-list").innerHTML=[{t:"0:00",g:bloom,note:"Bloom"},{t:"0:45",g:Math.round(w*.6),note:""},{t:"1:30",g:Math.round(w),note:""}].map(stageRow).join("")},
  export:()=>doExport(),"import-merge":()=>runImport(false),"import-replace":()=>runImport(true),
  "ask-wipe":()=>confirmSheet("Delete all your data?","Every coffee, preparation and photo is removed. Your badges stay. Export first if you want a copy.","Delete everything","wipe"),
  wipe:()=>{wipe();S.meta.demoOff=true;saveMeta();closeSheet();go("coffees");toast("All data deleted")},
  retry:()=>boot()
};
document.addEventListener("click",e=>{const el=e.target.closest("[data-act]");if(!el)return;const fn=ACT[el.dataset.act];if(fn){e.preventDefault();fn(el.dataset.id,el)}});
document.addEventListener("submit",e=>{e.preventDefault();if(e.target.id==="coffee-form")saveCoffee(e.target);else if(e.target.id==="brew-form")saveBrew(e.target)});
document.addEventListener("input",e=>{const t=e.target;
  if(t.id==="q"){ui.q=t.value;$("#coffee-list").innerHTML=coffeeList()}
  else if(t.id==="b-rating"){const r=Number(t.value);t.style.setProperty("--p",r*20+"%");$("#rate-out").textContent=r?fmtRate(r):"–";$("#rate-pips").innerHTML=pips(r||null)}
  else if(t.id==="b-dose"||t.id==="b-water")updRatio();
  else if(t.id==="ed-ang"){ED.ang=Number(t.value)||0;$("#ed-ang-out").textContent=ED.ang+"°";edDraw()}
  else if(t.id==="c-roast"){const n=ROASTN[Number(t.value)||0];$("#c-roast-out").textContent=n;t.setAttribute("aria-valuetext",n)}
});
document.addEventListener("change",async e=>{const t=e.target;
  if(t.name==="method"&&t.form&&t.form.id==="brew-form")methodChanged(t.value)
  else if(t.id==="adv-toggle")$("#adv-wrap").hidden=!t.checked
  else if(t.id==="c-process"){const on=t.value==="__custom";$("#c-process-box").hidden=!on;if(on)$("#c-process-custom").focus()}
  else if(t.id==="c-more")$("#c-more-box").hidden=!t.checked
  else if((t.id==="photo-file"||t.id==="photo-cam")&&t.files[0]){const f=t.files[0];t.value="";openEditor(URL.createObjectURL(f),true)}
  else if(t.id==="import-file"&&t.files[0]){const f=t.files[0];t.value="";readImport(f)}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!editor.hidden){closeEditor();return}
  if(e.key==="Escape"&&sheetRoot.classList.contains("open"))closeSheet();
  if(e.key==="Enter"&&e.target.tagName==="INPUT"&&e.target.form&&!e.target.name){e.preventDefault();if(e.target.id==="new-method-name")addMethod()}});

/* ---------- boot ---------- */
async function boot(){
  view.innerHTML=`<div class="loading"><p>Opening your coffee shelf…</p></div>`;
  const docs=await Store.init();
  if(docs===null){view.innerHTML=`<div class="loading"><div class="empty"><h3>Your data can't be reached yet</h3><p>Check your connection and try again. Nothing has been lost.</p><button class="btn primary" type="button" data-act="retry">Try again</button></div></div>`;return}
  hydrate(docs);
  if(!coffees().length&&!S.meta.demoOff)loadDemo();
  const h=location.hash.slice(1);if(h)cur=h;
  S.ready=true;checkBadges(true);render(true);
}
boot();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
