# Publishes the app with GitHub Pages on every push.
# The coffee catalog is switched off: the app no longer uses it, and the scraper only
# runs if you start this workflow by hand with "Update the coffee catalog" ticked.
name: Publish Beanbook

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      scrape:
        description: "Update the coffee catalog"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: catalog-and-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Update catalog
        if: inputs.scrape
        run: python scraper/beanbook_scraper.py --sources scraper/sources.json --out site/catalog.json

      - name: Commit catalog
        if: inputs.scrape
        run: |
          git config user.name "beanbook-bot"
          git config user.email "beanbook-bot@users.noreply.github.com"
          git add site/catalog.json scraper/report.json scraper/state.json
          git diff --cached --quiet || git commit -m "Update coffee catalog"
          git push

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
