# Refreshes the coffee catalog on a schedule and publishes the app with GitHub Pages.
name: Update catalog and publish

on:
  schedule:
    - cron: "17 4 * * 1,4"   # Mondays and Thursdays, 04:17 UTC
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: catalog-and-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Scrape on the schedule and on manual runs; a plain push only republishes the site.
      - name: Update catalog
        if: github.event_name != 'push'
        run: python scraper/beanbook_scraper.py --sources scraper/sources.json --out site/catalog.json

      - name: Commit catalog
        if: github.event_name != 'push'
        run: |
          git config user.name "beanbook-bot"
          git config user.email "beanbook-bot@users.noreply.github.com"
          git add site/catalog.json
          git diff --cached --quiet || git commit -m "Update coffee catalog"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
