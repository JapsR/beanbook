# On every push to main:
#   1. builds the app (src/ + public/ → dist/) and publishes it with GitHub Pages;
#   2. runs the smoke test and re-renders the README header image, committing it when it changed.
# The coffee catalog scraper is switched off. It only runs when this workflow is started by hand
# with "Update the coffee catalog" ticked.
name: Publish Beanbook

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      scrape:
        description: "Update the coffee catalog"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: catalog-and-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v6

      - name: Update catalog
        if: inputs.scrape
        run: python3 tools/catalog-scraper/beanbook_scraper.py

      - name: Commit catalog
        if: inputs.scrape
        run: |
          git config user.name "beanbook-bot"
          git config user.email "beanbook-bot@users.noreply.github.com"
          git add tools/catalog-scraper
          git diff --cached --quiet || git commit -m "Update coffee catalog [skip ci]"
          git push

      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: node scripts/build.mjs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  readme-image:
    name: Test and update README image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: node scripts/readme-header.mjs
      - name: Commit the image if it changed
        run: |
          git config user.name "beanbook-bot"
          git config user.email "beanbook-bot@users.noreply.github.com"
          git add docs/images/header.png
          if git diff --cached --quiet; then echo "Header image unchanged"; exit 0; fi
          git commit -m "Update README header image [skip ci]"
          git pull --rebase
          git push
