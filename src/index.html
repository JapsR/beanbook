<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beanbook</title>
<meta name="theme-color" content="#DE2C4A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Beanbook">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- build:css -->
<link rel="stylesheet" href="styles/main.css">
<!-- /build:css -->
</head>
<body>
<div id="app">
  <main id="view"><div class="loading"><p>Opening your coffee shelf…</p></div></main>
  <button id="fab" type="button" data-act="fab" hidden></button>
  <aside id="side"><div id="brand" aria-hidden="true">Bean<em>book</em></div>
    <nav id="tabs" aria-label="Sections"></nav></aside>
  <div id="sheet-root"></div>
  <div id="editor" hidden></div>
  <div id="toasts" aria-live="polite"></div>
</div>
<!-- build:js -->
<script type="module" src="app/main.js"></script>
<!-- /build:js -->
</body>
</html>
